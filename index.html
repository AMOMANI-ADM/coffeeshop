<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17634a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>الكوفي شوب</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--pri:#17634a;--acc:#c8963e;--bg:#f6f3ee;--card:#fff;--ink:#1d2320;--mut:#6b736f;--line:#e6e0d6;--ok:#1f8a4c;--warn:#b7791f;--bad:#c0392b;--r:14px;--safe:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",Tahoma,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.ltr{direction:ltr;unicode-bidi:isolate}
header{position:sticky;top:0;z-index:5;background:var(--pri);color:#fff;padding:10px 14px calc(10px);display:flex;align-items:center;gap:10px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
header img{width:38px;height:38px;border-radius:50%;background:#fff;object-fit:contain}
header h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:10px;padding:6px 10px;font-size:13px}
main{padding:14px 14px calc(96px + var(--safe));max-width:720px;margin:0 auto}
nav.tabs{position:fixed;bottom:0;inset-inline:0;z-index:6;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:var(--safe)}
nav.tabs button{flex:1;border:0;background:none;padding:8px 2px 7px;font-size:11.5px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--pri);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
h2{font-size:17px;margin:4px 0 10px}
h3{font-size:15px;margin:10px 0 6px}
.muted{color:var(--mut)}.sm{font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;font-weight:600;cursor:pointer}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.acc{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.block{width:100%}.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5}
.fld{margin-bottom:10px}.fld label{display:block;font-size:13px;color:var(--mut);margin-bottom:4px}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--pri);outline-offset:-1px}
.code{letter-spacing:10px;text-align:center;font-size:24px;direction:ltr}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:13.5px}
.chips button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
.prod{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:6px;position:relative;text-align:start}
.prod svg.picon{width:64px;height:64px;align-self:center}
.prod b{font-size:14px;line-height:1.35}
.prod .pr{color:var(--pri);font-weight:700}
.prod .pr del{color:var(--mut);font-weight:400;font-size:12px;margin:0 4px}
.prod .add{position:absolute;top:8px;inset-inline-end:8px;width:30px;height:30px;border-radius:50%;border:0;background:var(--pri);color:#fff;font-size:20px;line-height:1}
.prod .cnt{position:absolute;top:8px;inset-inline-start:8px;background:var(--acc);color:#fff;border-radius:999px;min-width:22px;height:22px;font-size:12px;display:grid;place-items:center;padding:0 6px}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;background:#eef0ee;color:#444}
.pill.ok{background:#e3f4ea;color:var(--ok)}.pill.warn{background:#fbf0dc;color:var(--warn)}.pill.bad{background:#fbe5e2;color:var(--bad)}.pill.acc{background:#f6ead3;color:#8a611d}
.cartbar{position:fixed;inset-inline:12px;bottom:calc(64px + var(--safe));z-index:6;background:var(--acc);color:#fff;border:0;border-radius:14px;padding:13px 16px;display:flex;justify-content:space-between;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.line{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line .grow{flex:1;min-width:0}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:18px;line-height:1}
.seg{display:flex;background:#eef0ee;border-radius:12px;padding:3px;gap:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;border-radius:10px;padding:8px 4px;font-size:13.5px}
.seg button.on{background:#fff;font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.tot{display:flex;justify-content:space-between;padding:3px 0}
.tot.big{font-size:18px;font-weight:800;border-top:1px solid var(--line);margin-top:6px;padding-top:8px}
.member{border-radius:20px;padding:18px;color:#fff;position:relative;overflow:hidden;margin-bottom:12px}
.member .tier{font-size:13px;letter-spacing:.5px;opacity:.95}
.member h2{color:#fff;margin:2px 0 12px;font-size:20px}
.member .qr{background:#fff;border-radius:16px;padding:14px;display:grid;place-items:center;margin:0 auto;width:236px}
.member .no{text-align:center;font-size:20px;font-weight:800;letter-spacing:2px;margin-top:10px}
.t-platinum{background:linear-gradient(135deg,#4b5563,#9ca3af 55%,#e5e7eb)}
.t-gold{background:linear-gradient(135deg,#8a5a12,#d4a437 55%,#f3d98b)}
.t-silver{background:linear-gradient(135deg,#6b7280,#b6bcc6 55%,#e9ecef);color:#1d2320}
.t-silver h2{color:#1d2320}
.t-regular{background:linear-gradient(135deg,var(--pri),#2f8a69)}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center}
.sheet .in{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + var(--safe))}
.toast{position:fixed;top:12px;inset-inline:12px;z-index:30;background:#1d2320;color:#fff;border-radius:12px;padding:12px 14px;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.empty{text-align:center;color:var(--mut);padding:26px 10px}
.banner{background:#fbf0dc;border:1px solid #efd9a8;color:#6b4a10;border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:13.5px}
.offer{display:flex;gap:12px;align-items:center}
.offer .badge{flex:none;width:58px;height:58px;border-radius:14px;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:800;font-size:16px;text-align:center;line-height:1.1}
.sizes{display:flex;gap:8px;margin:8px 0}
.sizes button{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 4px}
.sizes button.on{border-color:var(--pri);outline:2px solid var(--pri)}
.install{display:flex;gap:10px;align-items:center}
.spin{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* ---- Coffee-house theme: warm cream, deep green and gold, Arabic type, soft cards ---- */
/* Default type: Figtree for English letters and numbers, Tajawal for Arabic (both free, SIL Open Font License). */
@font-face{font-family:"CS En";src:url(fonts/Figtree.woff2) format("woff2");font-weight:300 900;font-display:swap}
@font-face{font-family:"CS Ar";src:url(fonts/Tajawal-Regular.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"CS Ar";src:url(fonts/Tajawal-Medium.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"CS Ar";src:url(fonts/Tajawal-Bold.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"CS Ar";src:url(fonts/Tajawal-ExtraBold.woff2) format("woff2");font-weight:800;font-display:swap}
:root{--pri:#0d4f3c;--pri2:#16725a;--acc:#c9a45c;--coffee:#2b1d14;--bg:#f7f2ea;--card:#fffdf9;--ink:#2b1d14;--mut:#7c7066;--line:#ece3d6;--r:20px;--shadow:0 6px 22px rgba(43,29,20,.08)}
html,body{font-family:"CS En","CS Ar","Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);font-size:15.5px}
h1,h2,h3,.kufi,.prod b,.member h2,.hero h2{font-family:"CS En","CS Ar",sans-serif;font-weight:800;letter-spacing:0}
header{background:var(--bg);color:var(--ink);box-shadow:none;padding:12px 16px 8px;border-bottom:1px solid transparent}
header.scrolled{border-bottom-color:var(--line);box-shadow:0 2px 12px rgba(43,29,20,.06)}
header img{width:40px;height:40px;border:2px solid var(--acc);padding:2px}
header h1{font-size:18px;color:var(--pri)}
header button{background:var(--card);color:var(--pri);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:700}
main{padding:6px 16px calc(120px + var(--safe))}
h2{font-size:18px;color:var(--coffee)}
.card{border-radius:var(--r);border:1px solid var(--line);box-shadow:var(--shadow);background:var(--card)}
.btn{border-radius:999px;padding:11px 18px}
.btn.pri{background:var(--pri);border-color:var(--pri)}
.btn.acc{background:var(--acc);border-color:var(--acc);color:var(--coffee)}
.fld input,.fld select,.fld textarea{border-radius:14px;background:var(--card)}
/* Home: greeting, rewards and how the customer wants the order */
.hero{border-radius:26px;padding:18px 18px 16px;color:#fff;background:radial-gradient(120% 140% at 100% 0%,var(--pri2) 0%,var(--pri) 55%,#082f24 100%);box-shadow:0 12px 28px rgba(13,79,60,.28);position:relative;overflow:hidden;margin:4px 0 14px}
.hero::after{content:"";position:absolute;inset-inline-end:-40px;bottom:-60px;width:180px;height:180px;border-radius:50%;background:rgba(201,164,92,.18)}
.hero .hi{font-size:13px;opacity:.85}
.hero h2{color:#fff;font-size:21px;margin:2px 0 12px}
.hero .stats{display:flex;gap:10px;position:relative;z-index:1}
.hero .stat{flex:1;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:10px 12px;cursor:pointer;color:#fff;text-align:start}
.hero .stat small{display:block;font-size:11.5px;opacity:.8}
.hero .stat b{font-size:16px;font-weight:800}
.hero .tierdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:6px;vertical-align:middle;background:var(--acc)}
.otype{display:flex;gap:8px;margin:0 0 14px}
.otype button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;font-weight:700;color:var(--coffee);box-shadow:var(--shadow)}
.otype button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.otype button.on{background:var(--coffee);border-color:var(--coffee);color:#fff}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 10px}
.sec h2{margin:0}.sec button{border:0;background:none;color:var(--pri);font-weight:700;font-size:13px}
.promo{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 14px;margin:0 -16px;padding-inline:16px;scrollbar-width:none}
.promo::-webkit-scrollbar{display:none}
.promo .pc{flex:0 0 78%;max-width:320px;scroll-snap-align:start;border-radius:22px;padding:16px;color:var(--coffee);background:linear-gradient(135deg,#f3e3c3,#e7c98d);box-shadow:var(--shadow);position:relative;overflow:hidden;min-height:118px}
.promo .pc:nth-child(3n+2){background:linear-gradient(135deg,#e5efe9,#bfd9cc)}
.promo .pc:nth-child(3n){background:linear-gradient(135deg,#f1dfd6,#dcb7a3)}
.promo .pc .big{font-weight:800;font-size:28px;line-height:1.1;color:var(--pri)}
.promo .pc b{display:block;margin-top:6px}
.promo .pc small{color:#5e5148}
/* Categories as a sticky row of tabs */
.chips{position:sticky;top:60px;z-index:4;background:var(--bg);margin:0 -16px 6px;padding:8px 16px 10px}
.chips button{border:0;background:transparent;border-radius:0;padding:6px 2px;margin-inline-end:14px;font-size:14.5px;font-weight:700;color:var(--mut);border-bottom:3px solid transparent}
.chips button.on{background:transparent;color:var(--coffee);border-bottom-color:var(--acc)}
/* Products as rows: picture, name, price, add */
.grid{display:flex;flex-direction:column;gap:12px}
@media(min-width:560px){.grid{display:grid;grid-template-columns:repeat(2,1fr)}}
.prod{flex-direction:row;align-items:center;gap:14px;padding:12px;border-radius:22px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.prod .pic{flex:none;width:84px;height:84px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#fff 0%,#f3ebdd 70%);display:grid;place-items:center}
.prod svg.picon{width:62px;height:62px}
.prod .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.prod b{font-size:15px}
.prod .pr{font-size:15px;color:var(--coffee)}
.prod .add{position:static;flex:none;width:38px;height:38px;background:var(--pri);box-shadow:0 4px 10px rgba(13,79,60,.3);font-size:22px}
.prod .cnt{top:10px;inset-inline-start:10px;background:var(--acc);color:var(--coffee);font-weight:800}
.pill.acc{background:#f4e7cc;color:#7a5a1c}
/* Floating tab bar and cart */
nav.tabs{inset-inline:12px;bottom:calc(10px + var(--safe));border:1px solid var(--line);border-radius:24px;background:rgba(255,253,249,.96);backdrop-filter:blur(10px);box-shadow:0 10px 30px rgba(43,29,20,.14);padding:6px}
nav.tabs button{border-radius:18px;padding:7px 2px 6px;font-size:11px}
nav.tabs button.on{background:var(--pri);color:#fff}
.cartbar{bottom:calc(84px + var(--safe));inset-inline:16px;background:var(--coffee);color:#fff;border-radius:999px;padding:14px 20px;align-items:center;box-shadow:0 10px 26px rgba(43,29,20,.3)}
.cartbar .n{background:var(--acc);color:var(--coffee);border-radius:999px;min-width:26px;height:26px;display:inline-grid;place-items:center;margin-inline-end:8px;font-weight:800}
.member{border-radius:26px;box-shadow:0 12px 28px rgba(43,29,20,.18)}
.t-regular{background:radial-gradient(120% 140% at 100% 0%,var(--pri2),var(--pri) 55%,#082f24)}
.sheet .in{border-radius:26px 26px 0 0;background:var(--bg)}
.seg{background:#efe6d8;border-radius:999px}.seg button{border-radius:999px}.seg button.on{background:var(--coffee);color:#fff}
.offer .badge{border-radius:18px;background:linear-gradient(135deg,#e7c98d,var(--acc));color:var(--coffee)}
.toast{border-radius:999px;background:var(--coffee)}
</style>
</head>

const prodBy=id=>(ST.menu?.products||[]).find(p=>p.id===id);
const liveOffers=()=>ST.menu?.offers||[];
const offerHits=(o,p)=>o.targetType==='all'||(o.targetType==='cat'&&o.target===p.cat)||(o.targetType==='product'&&o.target===p.id);
function offerDisc(o,price,qty){const b=price*qty;if(o.type==='percent')return r2(b*(+o.value||0)/100);if(o.type==='amount')return r2(Math.min((+o.value||0)*qty*(1+tax()/100),b));if(o.type==='bxgy'){const x=+o.buy||0,y=+o.get||0;if(x<1||y<1)return 0;return r2(Math.floor(qty/(x+y))*y*price)}return 0}
const tax=()=>+(ST.info?.shop?.taxRate??15);
const sizePrice=(p,z)=>!p.sized?p.price:z==='s'?(p.priceS||p.price):z==='l'?(p.priceL||p.price):p.price;
const bestDisc=(p,price,qty)=>Math.max(0,...liveOffers().filter(o=>offerHits(o,p)).map(o=>offerDisc(o,price,qty)));
function cartCalc(){let sub=0,disc=0;const lines=ST.cart.map(c=>{const p=prodBy(c.p);if(!p)return null;const price=sizePrice(p,c.size),d=bestDisc(p,price,c.qty);sub+=price*c.qty;disc+=d;return{c,p,price,d,net:r2(price*c.qty-d)}}).filter(Boolean);
  const s=(ST.me?.subs||[]).find(x=>x.state==='live'&&x.branch===(ST.branch||'b_main')),sd=s?r2((sub-disc)*(+s.discount||0)/100):0,fee=ST.type==='deliver'?+ST.info.deliveryFee||0:0;
  return{lines,sub:r2(sub),disc:r2(disc),sd,fee,total:r2(sub-disc-sd+fee),subPlan:s}}

const cartCount=()=>ST.cart.reduce((a,c)=>a+c.qty,0);

/* Times a customer may choose: from the preparation time, every 10 minutes, up to the shop's limit. */
function etaSlots(){const i=ST.info||{},prep=i.prepMin==null?10:+i.prepMin,hrs=+i.etaHours||3,d=new Date(Date.now()+prep*60000),out=[];d.setSeconds(0,0);const m=d.getMinutes();d.setMinutes(Math.ceil(m/10)*10);const end=Date.now()+hrs*3600000;
  for(;d.getTime()<=end&&out.length<200;d.setMinutes(d.getMinutes()+10))out.push(String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'));return out}
function etaTxt(t){const[h,m]=t.split(':').map(Number),d=new Date();d.setHours(h,m,0,0);if(d.getTime()<Date.now()-1800000)d.setDate(d.getDate()+1);const mins=Math.round((d-Date.now())/60000),tm=d.toLocaleTimeString(LANG==='en'?'en-GB':'ar-SA-u-nu-latn',{hour:'numeric',minute:'2-digit'});return tm+' · '+(mins<60?T('بعد ')+mins+T(' دقيقة'):T('بعد ')+Math.floor(mins/60)+T(' س ')+(mins%60?(mins%60)+T(' د'):''))}
const needCode=k=>k==='sub'?!!(ST.info&&ST.info.codeSub):k==='order'?!!(ST.info&&ST.info.codeOrder):!(ST.info&&ST.info.codeDep===false);

 htype(d){ST.type=d.v;render()},
 pay(d){ST.pay=d.v;cartSheet()},
 async sendCode(){const L=ST.login;L.email=L.email.trim().toLowerCase();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(L.email))return toast(T('أدخل بريدًا إلكترونيًا صحيحًا.'));if(L.step==='signup'){if(L.name.trim().length<2)return toast(T('أدخل اسمك.'));if(L.phone.replace(/\D/g,'').length<8)return toast(T('الجوال غير صحيح.'))}
  ST.busy=true;redraw();const r=await api('/code',{body:{email:L.email,name:L.name,phone:L.phone}});ST.busy=false;
  if(r.ok&&r.j.needSignup){L.step='signup';redraw();return}
  if(!r.ok){redraw();return toast(errMsg(r.j))}
  store.set('app_email',L.email);L.step='code';L.code='';redraw();setTimeout(()=>{const e=$('#lc');e&&e.focus()},50)},
 async verify(){const L=ST.login;if(!/^\d{6,10}$/.test(L.code))return toast(T('الرمز غير صحيح أو انتهت صلاحيته.'));ST.busy=true;redraw();const r=await api('/verify',{body:{email:L.email,code:L.code}});ST.busy=false;
  if(!r.ok){redraw();return toast(errMsg(r.j))}TOKEN=r.j.token;if(!SB)store.set('app_token',TOKEN);L.step='email';L.code='';await loadMe();if(ST.me&&!ST.me.name){A.closeSheet();ST.tab='account';toast(T('أكمل بياناتك: الاسم والجوال.'))}redraw();render()},
 relogin(){ST.login.step='email';ST.login.code='';redraw()},
 async placeOrder(){const c=cartCalc();if(!c.lines.length)return toast(T('السلة فارغة.'));if(ST.type==='here'&&!ST.table)return toast(T('اختر الطاولة'));if(ST.type==='deliver'&&ST.address.trim().length<8)return toast(T('أدخل عنوان التوصيل.'));if((ST.type==='take'||ST.type==='here')&&!ST.eta)return toast(T(ST.type==='here'?'اختر وقت وصولك.':'اختر وقت الاستلام.'));
  if(ST.type==='deliver'&&+ST.info.deliveryMin>0&&c.total-c.fee<+ST.info.deliveryMin)return toast(T('أقل مبلغ للتوصيل ')+money(ST.info.deliveryMin));
  if(needCode('order')&&!ST.ocode){ST.busy=true;cartSheet();const cr=await api('/code',{body:{purpose:'order'}});ST.busy=false;if(!cr.ok){cartSheet();return toast(errMsg(cr.j))}ST.ocode={code:''};cartSheet();setTimeout(()=>{const e=$('#oc');e&&e.focus()},50);return}
  if(ST.ocode&&!/^\d{6,10}$/.test(ST.ocode.code))return toast(T('الرمز غير صحيح أو انتهت صلاحيته.'));
  ST.busy=true;cartSheet();const ws=(ST.me.wallets||[]).filter(w=>w.balance>0);
  const r=await api('/orders',{body:{code:ST.ocode?ST.ocode.code:'',branch:ST.branch||'b_main',type:ST.type,table:ST.table,address:ST.address,note:ST.note,eta:ST.type==='take'||ST.type==='here'?ST.eta:'',pay:ST.pay,wallet:ST.pay==='wallet'&&ws[0]?ws[0].id:'',items:ST.cart.map(x=>({p:x.p,size:x.size,qty:x.qty}))}});ST.busy=false;
  if(!r.ok){if(r.j.error==='wrong'&&ST.ocode)ST.ocode.code='';cartSheet();return toast(r.j.error==='min'?T('أقل مبلغ للتوصيل ')+money(ST.info.deliveryMin):errMsg(r.j))}
  ST.ocode=null;ST.cart=[];ST.note='';saveCart();store.set('app_addr',ST.address);A.closeSheet();toast(r.j.no?T('أُرسل طلبك برقم ')+r.j.no:T('أُرسل طلبك، ويظهر رقمه عند استلام المحل له.'));ST.tab='orders';await loadMe();render()},
 again(d){const o=(ST.me.orders||[]).find(x=>x.id===d.id);if(!o)return;(o.lines||[]).forEach(l=>{if(prodBy(l.p))addLine(l.p,l.size,+l.qty,true)});saveCart();ST.tab='menu';render();A.cart()},
 subReq(d){if(!ST.me){ST.tab='account';render();return}REQ_F={kind:'sub',plan:(d&&d.id)||((prevSub()&&ST.menu.plans.some(p=>p.id===prevSub().planId))?prevSub().planId:'')||(ST.menu.plans[0]||{}).id||'',amount:'',code:'',step:'start'};if(!ST.menu.plans.length)return toast(T('اختر الباقة.'));$('#sheet').dataset.k='req';reqSheet()},
 depReq(){REQ_F={kind:'deposit',plan:'',amount:'',code:'',step:'start'};$('#sheet').dataset.k='req';reqSheet()},
 async reqCode(){const f=REQ_F;if(f.kind==='deposit'&&!(+f.amount>=1&&+f.amount<=10000))return toast(T('أدخل مبلغًا بين 1 و10000.'));if(f.kind==='sub'&&!f.plan)return toast(T('اختر الباقة.'));if(f.kind==='deposit'){const lim=walletLimit(+f.amount);if(lim)return toast(lim)}if(!needCode(f.kind))return A.reqSubmit();
  ST.busy=true;reqSheet();const r=await api('/code',{body:{purpose:f.kind}});ST.busy=false;if(!r.ok){reqSheet();return toast(errMsg(r.j))}f.step='code';f.code='';reqSheet();setTimeout(()=>{const e=$('#rc');e&&e.focus()},50)},
 async reqSubmit(){const f=REQ_F;if(needCode(f.kind)&&!/^\d{6,10}$/.test(f.code))return toast(T('الرمز غير صحيح أو انتهت صلاحيته.'));const w=(ST.me.wallets||[])[0];
  ST.busy=true;reqSheet();const r=await api('/requests',{body:{kind:f.kind,renew:f.renew||'',plan:f.plan,amount:+f.amount,wallet:f.kind==='deposit'&&w?w.id:'',branch:ST.branch||'b_main',code:f.code}});ST.busy=false;
  if(!r.ok){reqSheet();return toast(errMsg(r.j))}A.closeSheet();toast(T('أُرسل طلبك.')+' '+T('مرجع ')+r.j.ref);ST.tab='account';await loadMe();render()},
 async saveProfile(){const n=$('#pn').value.trim(),p=$('#pp').value.trim();if(n.length<2)return toast(T('أدخل اسمك.'));if(p.replace(/\D/g,'').length<8)return toast(T('الجوال غير صحيح.'));const r=await api('/profile',{body:{name:n,phone:p}});if(!r.ok)return toast(errMsg(r.j));toast(T('حُفظت بياناتك.'));await loadMe();render()},
 async logout(){await api('/logout',{body:{}});TOKEN=null;store.set('app_token',null);ST.me=null;ST.tab='menu';render()},
 async install(){if(!deferredInstall)return;deferredInstall.prompt();await deferredInstall.userChoice;deferredInstall=null;render()},
 noinst(){store.set('app_noinst','1');render()}
};
function addLine(p,size,qty,quiet){qty=qty||1;const c=ST.cart.find(x=>x.p===p&&x.size===size);if(c)c.qty=Math.min(50,c.qty+qty);else ST.cart.push({p,size,qty});saveCart();if(!quiet){render();toast('✓ '+nm(prodBy(p)))}}
function redraw(){if($('#sheet').innerHTML){$('#sheet').dataset.k==='cart'?cartSheet():render()}else render()}
document.addEventListener('click',e=>{const s=e.target.closest('[data-stop]'),a=e.target.closest('[data-a]');if(a&&a.dataset.a==='closeSheet'&&s&&a===a.closest('.sheet'))return;
  if(a&&!(a.classList.contains('sheet')&&s)){e.preventDefault();const f=A[a.dataset.a];if(f)f(a.dataset);return}
  const g=e.target.closest('[data-go]');if(g){ST.tab=g.dataset.go;render();if(['orders','account','card'].includes(ST.tab))loadMe().then(()=>{if(['orders','account','card'].includes(ST.tab))render()});window.scrollTo(0,0);return}
  const c=e.target.closest('[data-cat]');if(c){const row=$('.chips'),sl=row?row.scrollLeft:0,y=window.scrollY;ST.cat=c.dataset.cat;render();
    /* Redrawing rebuilds the chip row from its start, which hid the chosen chip and looked like a jump back to "All". Keep the row and the page where they were. */
    const nr=$('.chips');if(nr){nr.scrollLeft=sl;const on=nr.querySelector('.on');if(on)on.scrollIntoView({block:'nearest',inline:'nearest'})}window.scrollTo(0,Math.min(y,nr?nr.getBoundingClientRect().top+window.scrollY-8:y))}});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.l!==undefined){ST.login[t.dataset.l]=t.value;return}if(t.dataset.rf!==undefined){REQ_F[t.dataset.rf]=t.value;return}if(t.dataset.ad!==undefined){ST.address=t.value;return}if(t.dataset.nt!==undefined){ST.note=t.value;return}if(t.dataset.oc!==undefined&&ST.ocode){ST.ocode.code=t.value;return}});
document.addEventListener('change',async e=>{const t=e.target;if(t.dataset.br!==undefined){ST.branch=t.value;store.set('app_branch',t.value);ST.table='';await loadMenu();reopen();render()}if(t.dataset.tb!==undefined){ST.table=t.value}if(t.dataset.et!==undefined){ST.eta=t.value}if(t.dataset.rf!==undefined){REQ_F[t.dataset.rf]=t.value}});
$('#hlang').addEventListener('click',()=>{LANG=LANG==='en'?'':'en';store.set('app_lang',LANG);render();reopen()});
// Order status updates while the orders screen is open.
setInterval(async()=>{if(document.visibilityState==='visible'&&ST.me&&(ST.tab==='orders'||ST.tab==='account')&&!$('#sheet').innerHTML){await loadMe();render()}},20000);
(async function boot(){
  if('serviceWorker' in navigator&&location.protocol==='https:'||location.hostname==='localhost')try{navigator.serviceWorker.register('sw.js')}catch(e){}
  const r=await api('/info');if(!r.ok){$('#main').innerHTML='<div class="empty">'+esc(T('تعذر الاتصال بالخادم.'))+'</div>';return}
  ST.info=r.j;if(!LANG&&ST.info.shop.defaultLang==='en')LANG='en';if(!(ST.info.branches||[]).some(b=>b.id===ST.branch))ST.branch=(ST.info.branches[0]||{}).id||'b_main';
  if(!ST.info.mailReady)ST.login.note=true;render();await Promise.all([ST.info.on?loadMenu():null,loadMe()]);render()})();
</script>
</body>
</html>
